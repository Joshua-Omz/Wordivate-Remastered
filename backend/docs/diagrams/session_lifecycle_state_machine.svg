<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#858585;--accent:#0078D4;--surface:#181818;--card:#252526;--border:#3E3E42;--muted:#858585;--success:#4EC9B0;--warning:#CE9178;--danger:#F14C4C;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .state-node { rx: 8px; stroke-width: 1.5; }
  .state-title { font-size: 14px; font-weight: 700; }
  .state-desc { font-size: 11px; font-weight: 400; fill: #CCCCCC; }
  .transition-line { stroke-width: 1.5; fill: none; }
  .transition-text { font-size: 10.5px; font-weight: 600; }
</style>

<defs>
  <marker id="trans-arrow-blue" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#0078D4" />
  </marker>
  <marker id="trans-arrow-green" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#4EC9B0" />
  </marker>
  <marker id="trans-arrow-red" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#F14C4C" />
  </marker>
  <marker id="trans-arrow-muted" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#858585" />
  </marker>
</defs>

<!-- Header Banner -->
<rect x="30" y="20" width="990" height="42" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
<text x="50" y="46" font-size="15" font-weight="700" fill="#FFFFFF">Wordivate State Machine: Socratic Learning Session Lifecycle</text>
<text x="1000" y="46" font-size="11" font-weight="500" fill="#4EC9B0" text-anchor="end">Sprint 4 &amp; 5 | Section 3.2 State Flow</text>

<!-- Start Node [*] -->
<circle cx="80" cy="220" r="14" fill="#0078D4" stroke="#FFFFFF" stroke-width="2" />
<text x="80" y="255" font-size="11" font-weight="600" fill="#858585" text-anchor="middle">Start</text>

<!-- Transition Start -> Active -->
<line class="transition-line" x1="95" y1="220" x2="200" y2="220" stroke="#0078D4" marker-end="url(#trans-arrow-blue)" />
<text class="transition-text" x="145" y="208" fill="#9CDCFE" text-anchor="middle">POST /v1/sessions</text>
<text class="transition-text" x="145" y="235" fill="#858585" font-size="9.5px" text-anchor="middle">Word Captured</text>

<!-- STATE 1: ACTIVE -->
<g transform="translate(200, 160)">
  <rect class="state-node" x="0" y="0" width="230" height="120" fill="#1A2A3A" stroke="#0078D4" />
  <rect x="0" y="0" width="230" height="32" rx="8" fill="#0078D4" fill-opacity="0.25" />
  <circle cx="20" cy="16" r="5" fill="#0078D4" />
  <text class="state-title" x="35" y="21" fill="#FFFFFF">ACTIVE</text>
  <text class="state-desc" x="15" y="52">• Socratic turns in progress</text>
  <text class="state-desc" x="15" y="72">• SSE streaming tokens</text>
  <text class="state-desc" x="15" y="92">• Immutable snapshot locked</text>
  <text class="state-desc" x="15" y="108" fill="#858585" font-size="9.5px">status = 'active'</text>
</g>

<!-- Self-loop on ACTIVE: POST /messages -->
<path class="transition-line" d="M 280,160 C 280,100 350,100 350,160" stroke="#0078D4" marker-end="url(#trans-arrow-blue)" />
<rect x="260" y="90" width="120" height="20" rx="4" fill="var(--card)" stroke="#264F78" stroke-width="0.75"/>
<text class="transition-text" x="320" y="104" fill="#9CDCFE" text-anchor="middle">POST /messages</text>

<!-- Transition ACTIVE -> COMMITTING -->
<line class="transition-line" x1="430" y1="220" x2="520" y2="220" stroke="#CE9178" marker-end="url(#trans-arrow-muted)" />
<text class="transition-text" x="475" y="208" fill="#CE9178" text-anchor="middle">Tap "Commit"</text>
<text class="transition-text" x="475" y="235" fill="#858585" font-size="9.5px" text-anchor="middle">POST /commit-draft</text>

<!-- STATE 2: COMMITTING -->
<g transform="translate(520, 160)">
  <rect class="state-node" x="0" y="0" width="220" height="120" fill="#2E2419" stroke="#CE9178" />
  <rect x="0" y="0" width="220" height="32" rx="8" fill="#CE9178" fill-opacity="0.25" />
  <circle cx="20" cy="16" r="5" fill="#CE9178" />
  <text class="state-title" x="35" y="21" fill="#FFFFFF">COMMITTING</text>
  <text class="state-desc" x="15" y="52">• AI evaluates final dialogue</text>
  <text class="state-desc" x="15" y="72">• Generates commit draft</text>
  <text class="state-desc" x="15" y="92">• Learner edits personal def</text>
  <text class="state-desc" x="15" y="108" fill="#858585" font-size="9.5px">status = 'committing'</text>
</g>

<!-- Transition COMMITTING -> COMMITTED -->
<line class="transition-line" x1="740" y1="220" x2="830" y2="220" stroke="#4EC9B0" marker-end="url(#trans-arrow-green)" />
<text class="transition-text" x="785" y="208" fill="#4EC9B0" text-anchor="middle">Atomic Tx Commit</text>
<text class="transition-text" x="785" y="235" fill="#858585" font-size="9.5px" text-anchor="middle">POST /commit</text>

<!-- STATE 3: COMMITTED -->
<g transform="translate(830, 160)">
  <rect class="state-node" x="0" y="0" width="180" height="120" fill="#132B24" stroke="#4EC9B0" />
  <rect x="0" y="0" width="180" height="32" rx="8" fill="#4EC9B0" fill-opacity="0.25" />
  <circle cx="20" cy="16" r="5" fill="#4EC9B0" />
  <text class="state-title" x="35" y="21" fill="#FFFFFF">COMMITTED</text>
  <text class="state-desc" x="15" y="52">• Sealed into Library</text>
  <text class="state-desc" x="15" y="72">• entry_revisions rev 1</text>
  <text class="state-desc" x="15" y="92">• FTS tsvector indexed</text>
  <text class="state-desc" x="15" y="108" fill="#858585" font-size="9.5px">status = 'committed'</text>
</g>

<!-- End Node for COMMITTED [*] -->
<g transform="translate(920, 320)">
  <circle cx="0" cy="0" r="14" fill="none" stroke="#4EC9B0" stroke-width="2" />
  <circle cx="0" cy="0" r="8" fill="#4EC9B0" />
</g>
<line class="transition-line" x1="920" y1="280" x2="920" y2="304" stroke="#4EC9B0" marker-end="url(#trans-arrow-green)" />

<!-- DOWNWARD BRANCH 1: ACTIVE -> ABANDONED -->
<path class="transition-line" d="M 280,280 L 280,440 L 330,440" stroke="#858585" marker-end="url(#trans-arrow-muted)" />
<rect x="210" y="340" width="130" height="32" rx="4" fill="var(--card)" stroke="var(--border)" stroke-width="0.75"/>
<text class="transition-text" x="275" y="354" fill="#CCCCCC" text-anchor="middle">Inactivity (&gt; 30 min)</text>
<text class="transition-text" x="275" y="366" fill="#858585" font-size="9px" text-anchor="middle">or Explicit Cancel</text>

<!-- STATE 4: ABANDONED -->
<g transform="translate(330, 400)">
  <rect class="state-node" x="0" y="0" width="200" height="90" fill="#242426" stroke="#858585" />
  <rect x="0" y="0" width="200" height="28" rx="8" fill="#858585" fill-opacity="0.25" />
  <circle cx="18" cy="14" r="5" fill="#858585" />
  <text class="state-title" x="32" y="19" fill="#CCCCCC">ABANDONED</text>
  <text class="state-desc" x="15" y="48">• Transcript retained</text>
  <text class="state-desc" x="15" y="68">• Unique constraint freed</text>
  <text class="state-desc" x="15" y="82" fill="#858585" font-size="9px">status = 'abandoned'</text>
</g>

<!-- End Node for ABANDONED [*] -->
<g transform="translate(430, 535)">
  <circle cx="0" cy="0" r="14" fill="none" stroke="#858585" stroke-width="2" />
  <circle cx="0" cy="0" r="8" fill="#858585" />
</g>
<line class="transition-line" x1="430" y1="490" x2="430" y2="519" stroke="#858585" marker-end="url(#trans-arrow-muted)" />

<!-- DOWNWARD BRANCH 2: ACTIVE -> FAILED -->
<path class="transition-line" d="M 370,280 L 370,360 L 620,360 L 620,400" stroke="#F14C4C" marker-end="url(#trans-arrow-red)" />
<rect x="440" y="345" width="130" height="20" rx="4" fill="var(--card)" stroke="#5A1D1D" stroke-width="0.75"/>
<text class="transition-text" x="505" y="358" fill="#F48771" text-anchor="middle">Provider Outage / Err</text>

<!-- STATE 5: FAILED -->
<g transform="translate(620, 400)">
  <rect class="state-node" x="0" y="0" width="200" height="90" fill="#301B1B" stroke="#F14C4C" />
  <rect x="0" y="0" width="200" height="28" rx="8" fill="#F14C4C" fill-opacity="0.25" />
  <circle cx="18" cy="14" r="5" fill="#F14C4C" />
  <text class="state-title" x="32" y="19" fill="#FFFFFF">FAILED</text>
  <text class="state-desc" x="15" y="48">• Unrecoverable error</text>
  <text class="state-desc" x="15" y="68">• Clean socket teardown</text>
  <text class="state-desc" x="15" y="82" fill="#858585" font-size="9px">status = 'failed'</text>
</g>

<!-- End Node for FAILED [*] -->
<g transform="translate(720, 535)">
  <circle cx="0" cy="0" r="14" fill="none" stroke="#F14C4C" stroke-width="2" />
  <circle cx="0" cy="0" r="8" fill="#F14C4C" />
</g>
<line class="transition-line" x1="720" y1="490" x2="720" y2="519" stroke="#F14C4C" marker-end="url(#trans-arrow-red)" />

</svg>
