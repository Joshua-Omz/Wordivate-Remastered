<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 860" width="1420" height="860" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#858585;--accent:#0078D4;--surface:#181818;--card:#252526;--border:#3E3E42;--muted:#858585;--pk:#DCDCAA;--fk:#9CDCFE;--type:#4EC9B0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .entity-card { fill: var(--card); stroke: var(--border); stroke-width: 1.25; rx: 6px; }
  .entity-header { fill: var(--surface); stroke: var(--border); stroke-width: 1.25; rx: 6px; }
  .entity-title { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
  .field-name { font-size: 11px; font-weight: 500; fill: #E0E0E0; }
  .field-badge-pk { font-size: 9px; font-weight: 700; fill: #DCDCAA; }
  .field-badge-fk { font-size: 9px; font-weight: 700; fill: #9CDCFE; }
  .field-type { font-size: 10px; font-weight: 400; fill: #4EC9B0; text-anchor: end; }
  .rel-line { stroke: #6E7681; stroke-width: 1.5; fill: none; }
  .rel-text { font-size: 10.5px; font-weight: 600; fill: #CCCCCC; }
  .rel-badge { fill: var(--surface); stroke: var(--border); stroke-width: 1; rx: 4px; }
</style>

<defs>
  <marker id="crow-foot" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
    <path d="M 0,0 L 10,5 L 0,10 M 10,0 L 10,10" fill="none" stroke="#6E7681" stroke-width="1.2" />
  </marker>
  <marker id="one-one" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
    <line x1="5" y1="0" x2="5" y2="10" stroke="#6E7681" stroke-width="1.2" />
    <line x1="8" y1="0" x2="8" y2="10" stroke="#6E7681" stroke-width="1.2" />
  </marker>
</defs>

<!-- Header Banner -->
<rect x="30" y="16" width="1360" height="42" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
<text x="50" y="42" font-size="15" font-weight="700" fill="#FFFFFF">Wordivate Relational Schema: Entity-Relationship &amp; Foreign Key Architecture</text>
<text x="1370" y="42" font-size="11" font-weight="500" fill="#4EC9B0" text-anchor="end">Sprint 5 | Section 3.2 Relational Model</text>

<!-- 1. ENTITY: users -->
<g transform="translate(50, 90)">
  <rect class="entity-card" x="0" y="0" width="280" height="170" />
  <rect class="entity-header" x="0" y="0" width="280" height="34" />
  <text class="entity-title" x="14" y="22">users</text>
  
  <text class="field-badge-pk" x="14" y="55">PK</text>
  <text class="field-name" x="38" y="55">id</text>
  <text class="field-type" x="266" y="55">UUID</text>
  
  <text class="field-name" x="38" y="82">email</text>
  <text class="field-type" x="266" y="82">VARCHAR(255)</text>

  <text class="field-name" x="38" y="109">password_hash</text>
  <text class="field-type" x="266" y="109">TEXT</text>

  <text class="field-name" x="38" y="136">created_at</text>
  <text class="field-type" x="266" y="136">TIMESTAMPTZ</text>
</g>

<!-- 2. ENTITY: idempotency_keys -->
<g transform="translate(50, 310)">
  <rect class="entity-card" x="0" y="0" width="280" height="195" />
  <rect class="entity-header" x="0" y="0" width="280" height="34" />
  <text class="entity-title" x="14" y="22">idempotency_keys</text>

  <text class="field-badge-pk" x="14" y="55">PK</text>
  <text class="field-name" x="38" y="55">key</text>
  <text class="field-type" x="266" y="55">VARCHAR(255)</text>

  <text class="field-badge-fk" x="14" y="82">FK</text>
  <text class="field-name" x="38" y="82">user_id</text>
  <text class="field-type" x="266" y="82">UUID</text>

  <text class="field-name" x="38" y="109">request_hash</text>
  <text class="field-type" x="266" y="109">BYTEA</text>

  <text class="field-name" x="38" y="136">response</text>
  <text class="field-type" x="266" y="136">BYTEA</text>

  <text class="field-name" x="38" y="163">expires_at</text>
  <text class="field-type" x="266" y="163">TIMESTAMPTZ</text>
</g>

<!-- 3. ENTITY: definition_snapshots -->
<g transform="translate(50, 560)">
  <rect class="entity-card" x="0" y="0" width="300" height="220" />
  <rect class="entity-header" x="0" y="0" width="300" height="34" />
  <text class="entity-title" x="14" y="22">definition_snapshots</text>

  <text class="field-badge-pk" x="14" y="55">PK</text>
  <text class="field-name" x="38" y="55">id</text>
  <text class="field-type" x="286" y="55">UUID</text>

  <text class="field-name" x="38" y="82">source</text>
  <text class="field-type" x="286" y="82">TEXT</text>

  <text class="field-name" x="38" y="109">headword_key</text>
  <text class="field-type" x="286" y="109">TEXT</text>

  <text class="field-name" x="38" y="136">content_hash</text>
  <text class="field-type" x="286" y="136">BYTEA</text>

  <text class="field-name" x="38" y="163">raw_payload</text>
  <text class="field-type" x="286" y="163">JSONB</text>

  <text class="field-name" x="38" y="190">created_at</text>
  <text class="field-type" x="286" y="190">TIMESTAMPTZ</text>
</g>

<!-- 4. ENTITY: learning_sessions -->
<g transform="translate(420, 90)">
  <rect class="entity-card" x="0" y="0" width="340" height="255" />
  <rect class="entity-header" x="0" y="0" width="340" height="34" />
  <text class="entity-title" x="14" y="22">learning_sessions</text>

  <text class="field-badge-pk" x="14" y="55">PK</text>
  <text class="field-name" x="38" y="55">id</text>
  <text class="field-type" x="326" y="55">UUID</text>

  <text class="field-badge-fk" x="14" y="82">FK</text>
  <text class="field-name" x="38" y="82">user_id</text>
  <text class="field-type" x="326" y="82">UUID</text>

  <text class="field-name" x="38" y="109">headword_key</text>
  <text class="field-type" x="326" y="109">TEXT</text>

  <text class="field-badge-fk" x="14" y="136">FK</text>
  <text class="field-name" x="38" y="136">snapshot_id</text>
  <text class="field-type" x="326" y="136">UUID</text>

  <text class="field-name" x="38" y="163">status</text>
