  <text class="field-badge-fk" x="14" y="190">FK</text>
  <text class="field-name" x="38" y="190">entry_id (nullable)</text>
  <text class="field-type" x="326" y="190">UUID</text>

  <text class="field-name" x="38" y="217">created_at</text>
  <text class="field-type" x="326" y="217">TIMESTAMPTZ</text>
</g>

<!-- 5. ENTITY: commit_assessments -->
<g transform="translate(420, 410)">
  <rect class="entity-card" x="0" y="0" width="340" height="195" />
  <rect class="entity-header" x="0" y="0" width="340" height="34" />
  <text class="entity-title" x="14" y="22">commit_assessments</text>

  <text class="field-badge-pk" x="14" y="55">PK,FK</text>
