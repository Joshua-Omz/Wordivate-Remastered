  <text class="field-name" x="38" y="163">changed_at</text>
  <text class="field-type" x="346" y="163">TIMESTAMPTZ</text>
</g>

<!-- RELATIONSHIP LINES -->

<!-- users (1) -> learning_sessions (N) -->
<path class="rel-line" d="M 330,160 L 420,160" marker-start="url(#one-one)" marker-end="url(#crow-foot)" />
<rect class="rel-badge" x="345" y="145" width="60" height="20" />
<text class="rel-text" x="375" y="159" text-anchor="middle">owns</text>

<!-- users (1) -> idempotency_keys (N) -->
<path class="rel-line" d="M 190,260 L 190,310" marker-start="url(#one-one)" marker-end="url(#crow-foot)" />
<rect class="rel-badge" x="160" y="272" width="60" height="20" />
<text class="rel-text" x="190" y="286" text-anchor="middle">tracks</text>

<!-- users (1) -> vocab_entries (N) -->
<path class="rel-line" d="M 190,90 L 190,75 L 1030,75 L 1030,90" marker-start="url(#one-one)" marker-end="url(#crow-foot)" />
