  <text class="field-name" x="38" y="163">official_definition</text>
  <text class="field-type" x="346" y="163">TEXT</text>

  <text class="field-name" x="38" y="190">personal_definition</text>
  <text class="field-type" x="346" y="190">TEXT</text>

  <text class="field-name" x="38" y="217">personal_def_origin</text>
  <text class="field-type" x="346" y="217">VARCHAR(32)</text>

  <text class="field-name" x="38" y="244">understanding_flag</text>
  <text class="field-type" x="346" y="244">VARCHAR(32)</text>

  <text class="field-name" x="38" y="271">search_vector</text>
  <text class="field-type" x="346" y="271">TSVECTOR</text>

  <text class="field-name" x="38" y="298">created_at</text>
  <text class="field-type" x="346" y="298">TIMESTAMPTZ</text>
</g>

<!-- 7. ENTITY: entry_revisions -->
<g transform="translate(850, 500)">
  <rect class="entity-card" x="0" y="0" width="360" height="200" />
  <rect class="entity-header" x="0" y="0" width="360" height="34" />
