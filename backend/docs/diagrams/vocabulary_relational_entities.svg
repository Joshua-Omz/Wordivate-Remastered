  <text class="field-type" x="326" y="55">UUID</text>

  <text class="field-name" x="48" y="82">verdict</text>
  <text class="field-type" x="326" y="82">VARCHAR(32)</text>

  <text class="field-name" x="48" y="109">discrepancy_note</text>
  <text class="field-type" x="326" y="109">TEXT</text>

  <text class="field-name" x="48" y="136">raw_output</text>
  <text class="field-type" x="326" y="136">JSONB</text>

  <text class="field-name" x="48" y="163">assessed_at</text>
  <text class="field-type" x="326" y="163">TIMESTAMPTZ</text>
</g>

<!-- 6. ENTITY: vocab_entries -->
<g transform="translate(850, 90)">
  <rect class="entity-card" x="0" y="0" width="360" height="330" />
  <rect class="entity-header" x="0" y="0" width="360" height="34" stroke="#0078D4" />
  <circle cx="20" cy="17" r="5" fill="#0078D4" />
