<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1020" width="1260" height="1020" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--surface:#181818;--card:#252526;--border:#3E3E42;--muted:#858585;--success:#4EC9B0;--calc-bg:#162432;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .actor-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; rx: 6px; }
  .actor-title { font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
  .actor-sub { font-size: 10px; font-weight: 500; fill: var(--muted); text-anchor: middle; }
  .lifeline { stroke: #3E3E42; stroke-width: 1; stroke-dasharray: 6 4; }
  .msg-line { stroke: #CCCCCC; stroke-width: 1.25; }
  .msg-line-dashed { stroke: #858585; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .msg-text { font-size: 11px; font-weight: 500; fill: #E0E0E0; }
  .step-num { font-size: 10px; font-weight: 700; fill: #0078D4; }
  .note-box { fill: var(--card); stroke: var(--accent); stroke-width: 1; rx: 5px; }
  .note-text { font-size: 10.5px; font-weight: 600; fill: #9CDCFE; }
  .calc-box { fill: #132435; fill-opacity: 0.7; stroke: #0078D4; stroke-width: 1.5; rx: 6px; }
  .calc-badge { fill: #0078D4; rx: 4px; }
  .calc-badge-text { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
</style>

<defs>
  <marker id="arrow" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#0078D4" />
  </marker>
  <marker id="arrow-white" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#CCCCCC" />
  </marker>
  <marker id="arrow-dashed" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#858585" />
  </marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 9 3, 0 6" fill="#4EC9B0" />
  </marker>
</defs>

<!-- Header Banner -->
<rect x="30" y="16" width="1200" height="42" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
<text x="50" y="42" font-size="15" font-weight="700" fill="#FFFFFF">Wordivate Architecture Flow: Spaced Repetition (SM-2) &amp; Adaptive Recall Engine</text>
<text x="1210" y="42" font-size="11" font-weight="500" fill="#4EC9B0" text-anchor="end">Sprint 6 | Final User Loop Stage</text>

<!-- Lifelines -->
<line class="lifeline" x1="120" y1="125" x2="120" y2="950" />
<line class="lifeline" x1="380" y1="125" x2="380" y2="950" />
<line class="lifeline" x1="650" y1="125" x2="650" y2="950" />
<line class="lifeline" x1="930" y1="125" x2="930" y2="950" />
<line class="lifeline" x1="1170" y1="125" x2="1170" y2="950" />

<!-- Participant Headers Top -->
<g transform="translate(45, 75)">
  <rect class="actor-box" x="0" y="0" width="150" height="48" />
  <text class="actor-title" x="75" y="21">Learner</text>
  <text class="actor-sub" x="75" y="37">Flutter Mobile App</text>
</g>
<g transform="translate(305, 75)">
  <rect class="actor-box" x="0" y="0" width="150" height="48" />
  <text class="actor-title" x="75" y="21">Recall Handler</text>
  <text class="actor-sub" x="75" y="37">HTTP Transport Layer</text>
</g>
<g transform="translate(575, 75)">
  <rect class="actor-box" x="0" y="0" width="150" height="48" />
  <text class="actor-title" x="75" y="21">Recall Service</text>
  <text class="actor-sub" x="75" y="37">SM-2 Domain Engine</text>
</g>
<g transform="translate(855, 75)">
  <rect class="actor-box" x="0" y="0" width="150" height="48" />
  <text class="actor-title" x="75" y="21">Recall Repository</text>
  <text class="actor-sub" x="75" y="37">Persistence Boundary</text>
</g>
<g transform="translate(1095, 75)">
  <rect class="actor-box" x="0" y="0" width="150" height="48" />
  <text class="actor-title" x="75" y="21">PostgreSQL DB</text>
  <text class="actor-sub" x="75" y="37">Schedules &amp; Reviews</text>
</g>

<!-- ================= PHASE 1: RETRIEVAL OF DUE WORDS ================= -->
<rect x="50" y="145" width="1160" height="28" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
<text x="65" y="164" font-size="12" font-weight="700" fill="#0078D4">STAGE 1: DUE WORDS RETRIEVAL &amp; LAZY SCHEDULE SEEDING</text>

<!-- 1. GET /v1/recall/due -->
<line class="msg-line" x1="120" y1="195" x2="380" y2="195" marker-end="url(#arrow)" />
<text class="step-num" x="135" y="190">1</text>
<text class="msg-text" x="150" y="190">GET /v1/recall/due (Bearer JWT)</text>

<!-- 2. GetDueWords(ctx, userID) -->
<line class="msg-line" x1="380" y1="225" x2="650" y2="225" marker-end="url(#arrow)" />
<text class="step-num" x="395" y="220">2</text>
<text class="msg-text" x="410" y="220">GetDueWords(ctx, userID)</text>

<!-- 3. EnsureSchedulesForUser(ctx, userID) -->
<line class="msg-line" x1="650" y1="255" x2="930" y2="255" marker-end="url(#arrow)" />
<text class="step-num" x="665" y="250">3</text>
<text class="msg-text" x="680" y="250">EnsureSchedulesForUser(ctx, userID)</text>

<!-- 4. INSERT ON CONFLICT DO NOTHING -->
<line class="msg-line" x1="930" y1="280" x2="1170" y2="280" marker-end="url(#arrow)" />
<text class="step-num" x="945" y="275">4</text>
<text class="msg-text" x="960" y="275">INSERT ... ON CONFLICT DO NOTHING (Seed new vocab)</text>

<!-- 5. GetDueRecallEntries(ctx, userID, now, limit) -->
<line class="msg-line" x1="650" y1="315" x2="930" y2="315" marker-end="url(#arrow)" />
<text class="step-num" x="665" y="310">5</text>
<text class="msg-text" x="680" y="310">GetDueEntries(ctx, userID, now, limit)</text>

<!-- 6. SQL Query -->
<line class="msg-line" x1="930" y1="340" x2="1170" y2="340" marker-end="url(#arrow)" />
<text class="step-num" x="945" y="335">6</text>
<text class="msg-text" x="960" y="335">SELECT due words JOIN vocab_entries WHERE next_review_at &lt;= now()</text>

<!-- 7. Rows returned -->
<line class="msg-line-dashed" x1="1170" y1="370" x2="930" y2="370" marker-end="url(#arrow-dashed)" />
<text class="msg-text" x="1000" y="365">Due rows returned</text>

<line class="msg-line-dashed" x1="930" y1="395" x2="650" y2="395" marker-end="url(#arrow-dashed)" />
<text class="msg-text" x="720" y="390">[]DueWordItem with personal definitions</text>

<line class="msg-line-dashed" x1="650" y1="420" x2="380" y2="420" marker-end="url(#arrow-dashed)" />
<text class="msg-text" x="460" y="415">*DueWordsResponse</text>

<line class="msg-line-dashed" x1="380" y1="445" x2="120" y2="445" marker-end="url(#arrow-green)" />
<text class="msg-text" x="180" y="440" fill="#4EC9B0">HTTP 200 OK: { words: [...], count: N }</text>

<!-- ================= PHASE 2: REVIEW EVALUATION & CALCULATION ================= -->
<rect x="50" y="480" width="1160" height="28" rx="4" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
<text x="65" y="499" font-size="12" font-weight="700" fill="#4EC9B0">STAGE 2: ACTIVE RETRIEVAL PRACTICE &amp; SM-2 SCHEDULE EVALUATION</text>

<!-- 8. POST /v1/recall/reviews -->
<line class="msg-line" x1="120" y1="535" x2="380" y2="535" marker-end="url(#arrow)" />
<text class="step-num" x="135" y="530">8</text>
<text class="msg-text" x="150" y="530">POST /v1/recall/reviews { word_id, rating: 0-5 }</text>

<!-- 9. SubmitReview -->
<line class="msg-line" x1="380" y1="565" x2="650" y2="565" marker-end="url(#arrow)" />
<text class="step-num" x="395" y="560">9</text>
<text class="msg-text" x="410" y="560">SubmitReview(ctx, userID, req)</text>

<!-- 10. VerifyEntryOwnership -->
<line class="msg-line" x1="650" y1="595" x2="930" y2="595" marker-end="url(#arrow)" />
<text class="step-num" x="665" y="590">10</text>
<text class="msg-text" x="680" y="590">VerifyEntryOwnership(ctx, entryID, userID)</text>

<!-- 11. GetSchedule -->
<line class="msg-line" x1="650" y1="625" x2="930" y2="625" marker-end="url(#arrow)" />
<text class="step-num" x="665" y="620">11</text>
<text class="msg-text" x="680" y="620">GetSchedule(ctx, entryID, userID)</text>

<line class="msg-line-dashed" x1="930" y1="650" x2="650" y2="650" marker-end="url(#arrow-dashed)" />
<text class="msg-text" x="720" y="645">*RecallSchedule (interval, EF, reps)</text>

<!-- SM-2 Calculation Box -->
<g transform="translate(480, 675)">
  <rect class="calc-box" x="0" y="0" width="340" height="90" />
  <rect class="calc-badge" x="12" y="10" width="155" height="18" />
  <text class="calc-badge-text" x="89" y="23" text-anchor="middle">SM-2 Algorithm Logic</text>
  <text x="14" y="44" font-size="10.5" fill="#CCCCCC">&#8226; EF' = EF + (0.1 - (5-q)*(0.08 + (5-q)*0.02))</text>
  <text x="14" y="59" font-size="10.5" fill="#4EC9B0">&#8226; EF clamped at minimum 1.30 floor</text>
  <text x="14" y="74" font-size="10.5" fill="#CCCCCC">&#8226; q &gt;= 3: reps++, I(1)=1d, I(2)=6d, I(n)=I(n-1)*EF'</text>
  <text x="14" y="89" font-size="10.5" fill="#F48771">&#8226; q &lt; 3: reps=0, interval=1d (Reset penalty)</text>
</g>

<!-- 12. SaveReviewAndSchedule -->
<line class="msg-line" x1="650" y1="795" x2="930" y2="795" marker-end="url(#arrow)" />
<text class="step-num" x="665" y="790">12</text>
<text class="msg-text" x="680" y="790">SaveReviewAndSchedule(ctx, params)</text>

<!-- 13. Atomic DB TX -->
<line class="msg-line" x1="930" y1="825" x2="1170" y2="825" marker-end="url(#arrow)" />
<text class="step-num" x="945" y="820">13</text>
<text class="msg-text" x="960" y="820">BEGIN TX: Upsert schedule &amp; Insert review log</text>

<line class="msg-line" x1="930" y1="850" x2="1170" y2="850" marker-end="url(#arrow)" />
<text class="step-num" x="945" y="845">14</text>
<text class="msg-text" x="960" y="845">COMMIT TX</text>

<!-- 15. Return Result -->
<line class="msg-line-dashed" x1="930" y1="880" x2="650" y2="880" marker-end="url(#arrow-dashed)" />
<text class="msg-text" x="730" y="875">*ReviewResult</text>

<line class="msg-line-dashed" x1="650" y1="905" x2="380" y2="905" marker-end="url(#arrow-dashed)" />
<text class="msg-text" x="460" y="900">*ReviewResult</text>

<line class="msg-line-dashed" x1="380" y1="930" x2="120" y2="930" marker-end="url(#arrow-green)" />
<text class="msg-text" x="180" y="925" fill="#4EC9B0">HTTP 200 OK: { interval_days, next_review_at, ease_factor }</text>

<!-- Participant Footers -->
<g transform="translate(45, 960)">
  <rect class="actor-box" x="0" y="0" width="150" height="35" />
  <text class="actor-title" x="75" y="22">Learner</text>
</g>
<g transform="translate(305, 960)">
  <rect class="actor-box" x="0" y="0" width="150" height="35" />
  <text class="actor-title" x="75" y="22">Recall Handler</text>
</g>
<g transform="translate(575, 960)">
  <rect class="actor-box" x="0" y="0" width="150" height="35" />
  <text class="actor-title" x="75" y="22">Recall Service</text>
</g>
<g transform="translate(855, 960)">
  <rect class="actor-box" x="0" y="0" width="150" height="35" />
  <text class="actor-title" x="75" y="22">Recall Repository</text>
</g>
<g transform="translate(1095, 960)">
  <rect class="actor-box" x="0" y="0" width="150" height="35" />
  <text class="actor-title" x="75" y="22">PostgreSQL DB</text>
</g>

</svg>
